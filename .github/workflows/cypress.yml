name: Cypress Tests and Report

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  cypress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências do projeto de testes
        run: npm ci

      - name: Clonar aplicação Hub de Leitura
        uses: actions/checkout@v4
        with:
          repository: EBAC-QE/hub-de-leitura-integrado
          path: hub-de-leitura-integrado

      - name: Instalar dependências da aplicação
        working-directory: hub-de-leitura-integrado
        run: npm ci

      - name: Iniciar aplicação
        working-directory: hub-de-leitura-integrado
        run: |
          nohup npm start > server.log 2>&1 &
          sleep 5

      - name: Executar testes Cypress
        run: npm test

      - name: Gerar relatório Mochawesome
        if: always()
        run: npm run report

      - name: Publicar relatório como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-report
          path: cypress/report/

      - name: Publicar evidências dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-results
          path: |
            cypress/videos/
            cypress/screenshots/

  deploy:
    if: always()
    needs: cypress
    runs-on: ubuntu-latest

    steps:
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Baixar relatório Mochawesome
        uses: actions/download-artifact@v4
        with:
          name: mochawesome-report
          path: cypress/report

      - name: Preparar artefato do GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: cypress/report

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
